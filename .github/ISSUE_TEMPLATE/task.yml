name: Task
description: A unit of planned work
labels: ["task"]
body:
  - type: input
    id: owner
    attributes: {label: Owner (M01–M10), placeholder: M04}
    validations: {required: true}
  - type: textarea
    id: what
    attributes: {label: What needs to be done}
    validations: {required: true}
  - type: textarea
    id: done
    attributes: {label: Done when, value: "- [ ] tests pass\n- [ ] PR merged into develop"}
